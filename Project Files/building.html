<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nature</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans&display=swap" rel="stylesheet" />
  <style>
    @import url("https://fonts.googleapis.com/css2?family=DM+Sans&display=swap");

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #536942;
      --secondary: #36b2ff;
      --white: #efefef;
    }

    body {
      font-family: "DM Sans", sans-serif;
      color: var(--primary);
    }

    #main {
      position: relative;
      background-image: url("Final-Company-Background-Image.jpg");
      min-height: 50vh;
      background-position: bottom center;
      background-size: cover;
      padding: 0px 8%;
      display: flex;
      justify-content: flex-start;
      align-items: center;
      z-index: 1;
      overflow: hidden;
    }

    #main::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 100%;
      background: rgba(0, 0, 0, 0.2); /* semi-transparent black overlay */
      z-index: -1;
    }

    .container {
      max-width: 1200px;
      padding: 16px;
      margin: auto;
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .nav-list {
      display: flex;
      list-style: none;
      gap: 28px;
    }

    .nav-list a {
      color: var(--white);
      text-decoration: none;
    }

    .btn {
      padding: 12px 20px;
      background: transparent;
      outline: none;
      cursor: pointer;
      border-radius: 5px;
    }

    .btn-secondary {
      border: 2px solid var(--white);
      color: var(--white);
      font-weight: bold;
    }

    .btn-primary {
      border: none;
      background: var(--secondary);
      color: var(--primary);
    }

    .main-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-top: 80px;
      color: var(--white);
      text-align: center;
    }

    .main-content .intro-heading {
      font-size: 40px;
    }

    .main-content .main-heading {
      font-size: 100px;
      margin-top: -20px;
    }

    .main-content p {
      max-width: 250px;
      margin-bottom: 10px;
    }

    .services {
      margin-top: 40px;
      display: flex;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .service {
      width: 250px;
      text-align: center;
    }

    .service img {
      max-width: 100%;
      border-radius: 5px;
      transition: transform 0.3s ease;
    }

    .service img:hover {
      transform: scale(1.05);
    }

    .section-title {
      text-align: center;
      margin-bottom: 24px;
    }

    .line {
      width: 80px;
      height: 4px;
      background: var(--secondary);
      margin: 10px auto;
      border-radius: 2px;
    }

    /* ✅ MOBILE STYLES */
    @media (max-width: 768px) {
      #main {
        padding: 20px;
        justify-content: center;
        text-align: center;
      }

      .main-content .intro-heading {
        font-size: 28px;
      }

      .main-content .main-heading {
        font-size: 60px;
      }

      .services {
        flex-direction: column;
        align-items: center;
      }

      nav {
        flex-direction: column;
        gap: 16px;
      }

      .nav-list {
        flex-direction: column;
        gap: 16px;
      }

      .service {
        width: 90%;
      }
    }
  </style>
</head>
<body>

  <section id="main">
    <div class="container">
      <div class="main-content">
        <h1 class="intro-heading">Building Construction</h1>
      </div>
    </div>
  </section>

  <section id="services">
    <div class="container">
      <div class="section-title">
        <h1>Services</h1>
        <div class="line"></div>
      </div>

      <div class="services">
        <div class="service">
          <img src="b1.jpg"  />
        </div>
        <div class="service">
          <img src="b2.jpg" />
        </div>
        <div class="service">
          <img src="b3.jpg" />
        </div>
        <div class="service">
          <img src="b4.jpg"  />
        </div>
      </div>
    </div>
  </section>

</body>
</html>
